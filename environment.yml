name: libraont
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # External aligner (same binary installed on Streamlit Cloud via
  # packages.txt). conda puts it on PATH so the app resolves it automatically -
  # no path editing needed in the sidebar.
  - minimap2
  - pip
  - pip:
      - streamlit>=1.49
      - plotly>=5.20,<6
      - pandas>=2.0
      - numpy>=1.24
      - edlib>=1.3.9
      - kaleido==0.2.1
